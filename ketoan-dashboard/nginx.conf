server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache tĩnh: JS/CSS/fonts có hash trong tên → cache lâu dài
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: mọi route không khớp file tĩnh → trả index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
