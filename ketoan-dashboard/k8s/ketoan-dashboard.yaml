# Deploy: kubectl apply -f k8s/ketoan-dashboard.yaml
# Access: kubectl port-forward service/ketoan-dashboard 30080:80 --address 0.0.0.0
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ketoan-dashboard
  labels:
    app: ketoan-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ketoan-dashboard
  template:
    metadata:
      labels:
        app: ketoan-dashboard
    spec:
      containers:
        - name: ketoan-dashboard
          image: localhost:5000/ketoan-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

---

apiVersion: v1
kind: Service
metadata:
  name: ketoan-dashboard
spec:
  type: NodePort
  selector:
    app: ketoan-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
